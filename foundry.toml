[profile.default]
out = "out"
src = "bridge/contracts/sol"
libs = ["node_modules"]
# Used when forge create is run from the repo root (example CI workflows).
# via_ir required: ASCMinter + package ASCBase hit "stack too deep" without it.
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
  "@gluwa/usc-contracts/=node_modules/@gluwa/usc-contracts/",
]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "shanghai"
verbosity = 2

[lint]
lint_on_build = false
