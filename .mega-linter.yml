# Configuration file for MegaLinter
#
# See all available variables at https://megalinter.io/latest/config-file/ and in
# linters documentation

# all, none, or list of linter keys
APPLY_FIXES: none

JAVASCRIPT_DEFAULT_STYLE: prettier
TYPESCRIPT_DEFAULT_STYLE: prettier

DISABLE:
  - COPYPASTE # Comment to enable checks of excessive copy-pastes

DISABLE_LINTERS:
  - ACTION_ZIZMOR
  - BASH_SHFMT
  - COPYPASTE_JSCPD
  - REPOSITORY_GRYPE
  # https://gluwa.atlassian.net/browse/CSUB-460
  - REPOSITORY_TRIVY
  - REPOSITORY_OSV_SCANNER
  - REPOSITORY_GITLEAKS
  - JAVASCRIPT_ES
  - JAVASCRIPT_STANDARD
  - TYPESCRIPT_ES
  - TYPESCRIPT_STANDARD
  - SPELL_CSPELL
  # Tutorial markdown uses long command/URL lines; table formatter is noisy on existing docs.
  - MARKDOWN_MARKDOWN_TABLE_FORMATTER

SHOW_ELAPSED_TIME: true

# Bot-blocked or flaky doc/npm links (also listed in .lycheeignore).
SPELL_LYCHEE_ARGUMENTS: "--exclude '^https://www\\.npmjs\\.com/package/@gluwa/asc-contracts' --exclude '^https://cloud\\.google\\.com/application/web3/faucet/ethereum/sepolia' --exclude '^https://docs\\.attestcoin\\.org'"
