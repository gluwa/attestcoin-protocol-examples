[profile.default]
out = "out"
src = "contracts/sol"
test = "test"
libs = ["../node_modules", "../lib"]
# Resolve @gluwa/usc-contracts from yarn-installed npm package (decoding/EvmV1Decoder).
# ASCBase comes from the local bridge example contracts.
allow_paths = ["../bridge"]
remappings = [
  "@openzeppelin/=../node_modules/@openzeppelin/",
  "@gluwa/usc-contracts/=../node_modules/@gluwa/usc-contracts/",
  "@example/bridge/=../bridge/contracts/sol/",
  "forge-std/=../lib/forge-std/src/",
]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "shanghai"
verbosity = 2
