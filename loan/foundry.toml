[profile.default]
out = "out"
src = "contracts/sol"
test = "test"
libs = ["../node_modules", "../lib"]
# Resolve @gluwa/asc-contracts from yarn/npm (readability ASCBase + common/EvmV1Decoder).
# Same package as bridge — one ASCBase for both examples.
allow_paths = ["../node_modules", "../lib"]
remappings = [
    "@openzeppelin/=../node_modules/@openzeppelin/",
    "@gluwa/asc-contracts/=../node_modules/@gluwa/asc-contracts/",
    "forge-std/=../lib/forge-std/src/",
]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "shanghai"
verbosity = 2

# CI Foundry enables lint-on-build by default; remapped ../node_modules imports
# currently crash the lint engine after a successful compile.
[lint]
lint_on_build = false
