---
name: javascript-checks

"on":
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: read-all

jobs:
  execute-command:
    name: execute-command-${{ matrix.command }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        command: [build, check-format, eslint, typecheck]

    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'
      - run: npm install -g yarn

      - name: Install Foundry
        run: |
          # first install it
          unset XDG_CONFIG_HOME
          curl -L https://foundry.paradigm.xyz | bash
          ~/.foundry/bin/foundryup

          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"

      - name: Install forge-std
        run: git clone --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std

      - name: Checkout private ASC contracts (file:../usc-contracts)
        env:
          ASC_CONTRACTS_READ_TOKEN: ${{ secrets.ASC_CONTRACTS_READ_TOKEN }}
        run: |
          if [ -z "${ASC_CONTRACTS_READ_TOKEN}" ]; then
            echo "Missing secret ASC_CONTRACTS_READ_TOKEN (Contents:Read on gluwa/asc-contracts)"
            exit 1
          fi
          git clone --depth 1 \
            "https://x-access-token:${ASC_CONTRACTS_READ_TOKEN}@github.com/gluwa/asc-contracts.git" \
            "${GITHUB_WORKSPACE}/../usc-contracts"
      - name: Install dependencies
        run: |
          if [ -f yarn.lock ]; then
              yarn install --ignore-engines
          else
              npm clean-install
          fi

      - name: Execute command ${{ matrix.command }}
        run: |
          yarn ${{ matrix.command }}
