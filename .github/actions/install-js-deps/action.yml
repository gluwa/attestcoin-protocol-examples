name: Install JS deps
description: Install JS deps using gluwa/asc-contracts@main (private; ASC_CONTRACTS_READ_TOKEN)
inputs:
  token:
    description: GitHub token with Contents:Read on gluwa/asc-contracts (ASC_CONTRACTS_READ_TOKEN)
    required: true
runs:
  using: composite
  steps:
    - name: Require ASC_CONTRACTS_READ_TOKEN
      shell: bash
      env:
        ASC_CONTRACTS_READ_TOKEN: ${{ inputs.token }}
      run: |
        if [ -z "${ASC_CONTRACTS_READ_TOKEN}" ]; then
          echo "Missing secret ASC_CONTRACTS_READ_TOKEN (Contents:Read on https://github.com/gluwa/asc-contracts)"
          exit 1
        fi

    # yarn git+https + insteadOf often still hits unauthenticated ls-remote and gets
    # GitHub's "Repository not found" for private repos. actions/checkout applies the PAT.
    - name: Checkout gluwa/asc-contracts (main)
      uses: actions/checkout@v7
      with:
        repository: gluwa/asc-contracts
        ref: main
        token: ${{ inputs.token }}
        path: vendor/asc-contracts
        persist-credentials: false
        sparse-checkout: |
          contracts
          package.json
        sparse-checkout-cone-mode: false

    - name: yarn install (file:vendor/asc-contracts)
      shell: bash
      run: |
        if [ ! -f vendor/asc-contracts/package.json ]; then
          echo "Checkout of gluwa/asc-contracts failed — verify ASC_CONTRACTS_READ_TOKEN has Contents:Read on that repo"
          exit 1
        fi

        # package.json keeps git+https for local use; CI installs from the checked-out main tip.
        node <<'NODE'
        const fs = require('fs');
        const pkgPath = 'package.json';
        const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
        if (!pkg.dependencies || !pkg.dependencies['@gluwa/usc-contracts']) {
          console.error('package.json missing @gluwa/usc-contracts dependency');
          process.exit(1);
        }
        pkg.dependencies['@gluwa/usc-contracts'] = 'file:vendor/asc-contracts';
        fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
        NODE

        yarn install --ignore-engines

        # Restore manifests so later jobs (prettier/check-format) do not see CI-only edits.
        git checkout -- package.json yarn.lock 2>/dev/null || true

        echo "Installed @gluwa/usc-contracts from vendor/asc-contracts (gluwa/asc-contracts@main):"
        yarn list --pattern '@gluwa/usc-contracts' --depth=0 || true
        ls -la node_modules/@gluwa/usc-contracts/contracts/readability || true
        ls -la node_modules/@gluwa/usc-contracts/contracts/common || true
        test -d node_modules/@gluwa/usc-contracts/contracts/readability
        test -d node_modules/@gluwa/usc-contracts/contracts/common
