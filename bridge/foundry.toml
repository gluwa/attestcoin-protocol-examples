[profile.default]
out = "out"
src = "contracts/sol"
test = "test"
libs = ["../node_modules", "../lib"]
# Resolve @gluwa/usc-contracts from yarn (readability ASCBase + common/EvmV1Decoder).
# Package source is gluwa/asc-contracts (git #main via yarn); remapped under this alias.
allow_paths = ["../node_modules", "../lib"]
remappings = [
  "@openzeppelin/=../node_modules/@openzeppelin/",
  "@gluwa/usc-contracts/=../node_modules/@gluwa/usc-contracts/",
  "forge-std/=../lib/forge-std/src/",
]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "shanghai"
verbosity = 2

# CI Foundry enables lint-on-build by default; remapped ../node_modules imports
# currently crash the lint engine after a successful compile.
[lint]
lint_on_build = false
